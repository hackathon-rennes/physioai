name: Template Sync

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: template-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync with upstream template
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync template
        uses: AndreasAugustin/actions-template-sync@8ec19a5f2721ffb81ff809aa340ddf75e6a85ea6  # v2.5.2
        with:
          source_repo_path: talan-agents/jv-f4ct0ry
          pr_branch_name_prefix: chore/template-sync
          pr_title: 'chore(template): sync with upstream template'
          pr_labels: template-sync,automated
          pr_reviewers: talan-apps/cloud-team
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}